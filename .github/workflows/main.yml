name: Build MOHSEN APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Organize Source Files if Flat
        run: |
          if [ ! -f "lib/main.dart" ] && [ -f "main.dart" ]; then
            mkdir -p lib
            mv main.dart lib/main.dart
          fi

      - name: Initialize Android Platform & App Name
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name mohsen --org com.mohsen.plc .
          fi
          python3 -c '
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          txt = p.read_text()
          txt = re.sub(r"android:label=\"[^\"]+\"", "android:label=\"MOHSEN\"", txt)
          if "android.permission.INTERNET" not in txt:
              txt = txt.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application")
          if "usesCleartextTraffic" not in txt:
              txt = txt.replace("<application", "<application android:usesCleartextTraffic=\"true\"")
          p.write_text(txt)
          '

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload MOHSEN APK
        uses: actions/upload-artifact@v4
        with:
          name: MOHSEN-APK
          path: build/app/outputs/flutter-apk/app-*-release.apk
